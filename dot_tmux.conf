# 1. 기본 설정 (Prefix 변경)
# 기본 Ctrl-b는 손가락이 아프므로 Ctrl-a로 변경합니다. (Vim 유저들의 국룰)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 2. 인덱스 시작 번호 변경 (0은 너무 멉니다)
set -g base-index 1
setw -g pane-base-index 1

# 3. 마우스 지원 (가끔 스크롤이나 창 크기 조절 시 편리합니다)
set -g mouse on

# 4. 화면 분할 단축키 직관화
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 5. Vim 스타일로 창 이동 (hjkl 사용)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 6. 색상 및 상태바 설정 (Starship과 어울리는 미니멀리즘)
set -g default-terminal "screen-256color"
set -g status-style bg=default
set -g status-left-length 20
set -g status-left "[#S] "
set -g status-right "%Y-%m-%d %H:%M"
set -g status-justify centre

# 7. 설정 리로드 단축키 (Prefix + r)
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# 8. Tmux Plugin Manager (TPM) 설정 (나중에 확장성을 위해)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect' # 세션 저장/복구 (Prefix + Ctrl-s / Ctrl-r)

run '~/.tmux/plugins/tpm/tpm'
