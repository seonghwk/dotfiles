# 1. General settings (prefix key)
# Change default prefix from Ctrl-b to Ctrl-a (easier to reach, common Vim convention)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 2. Start window and pane indices at 1 (0 is too far on the keyboard)
set -g base-index 1
setw -g pane-base-index 1

# 3. Enable mouse support (useful for scrolling and pane resizing)
set -g mouse on

# 4. Intuitive split shortcuts
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 5. Vim-style pane navigation and resizing (hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (Prefix + HJKL) — repeatable with -r flag
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 6. Copy mode (vi keybindings)
# Enter with Prefix+[, navigate with hjkl, select with Space, copy with Enter
setw -g mode-keys vi

# 7. Color and status bar (minimal style that pairs with Starship)
set -g default-terminal "screen-256color"
set -g status-style bg=default
set -g status-left-length 20
set -g status-left "[#S] "
set -g status-right "%Y-%m-%d %H:%M"
set -g status-justify centre

# 8. Reload config shortcut (Prefix + r)
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# 9. Tmux Plugin Manager (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect' # session save/restore (Prefix + Ctrl-s / Ctrl-r)

run '~/.tmux/plugins/tpm/tpm'
